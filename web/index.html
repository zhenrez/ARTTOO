<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARTTOO Editor</title><link rel="stylesheet" href="./style.css"></head>
<body><main class="workspace"><header><strong>ARTTOO</strong><span id="status" role="status">Loading</span><span id="save-status" role="status">Not saved</span><button id="save" type="button">Save</button><div class="history"><button id="undo" type="button" aria-label="Undo (Ctrl+Z)">Undo</button><button id="redo" type="button" aria-label="Redo (Ctrl+Shift+Z)">Redo</button></div></header><section class="editor"><section class="stage" aria-label="Design workspace"><svg id="artboard" role="img" aria-label="White tattoo design artboard. Draw with pointer or stylus; select an existing stroke to transform it." tabindex="0"></svg></section><aside aria-label="Selection, layers and transform"><section aria-labelledby="layers-heading"><h2 id="layers-heading">Layers</h2><div id="layers-list" class="layers-list" role="listbox" aria-label="Design layers" tabindex="0"></div><small>Use Up and Down arrow keys to select layers without precision pointer input.</small></section><h2>Transform</h2><p id="selection" role="status">No object selected</p><fieldset id="transform" disabled><label>X (mm)<input id="transform-x" type="number" step="1"></label><label>Y (mm)<input id="transform-y" type="number" step="1"></label><label>Rotation (degrees)<input id="transform-rotation" type="number" step="1"></label><label>Scale X<input id="transform-scale-x" type="number" step="0.1"></label><label>Scale Y<input id="transform-scale-y" type="number" step="0.1"></label><button id="apply-transform" type="button">Apply</button><div class="nudge"><button id="nudge-left" type="button" aria-label="Move selected object left 1 millimeter">Left 1 mm</button><button id="nudge-right" type="button" aria-label="Move selected object right 1 millimeter">Right 1 mm</button></div><div class="nudge"><button id="flip-x" type="button" aria-label="Flip selected object horizontally">Flip horizontal</button><button id="flip-y" type="button" aria-label="Flip selected object vertically">Flip vertical</button></div><small>Arrow keys move 1 mm; Shift plus Arrow moves 10 mm. Negative scale represents an explicit mirror.</small></fieldset></aside></section></main><script type="module" src="./main.js"></script></body></html>
